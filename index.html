<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MoveLog</title>
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-inner">
    <div class="splash-icon">🏃‍♂️</div>
    <div class="splash-title">MOVELOG</div>
    <div class="splash-sub">YOUR TRAINING JOURNAL</div>
  </div>
</div>

<!-- HEADER -->
<header>
  <div class="header-left">
    <span class="logo-text">MOVE<span class="logo-accent">LOG</span></span>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="profileIconBtn" onclick="openModal('profileModal')">👤</button>
    <button class="icon-btn" onclick="exportCSV()">📤</button>
  </div>
</header>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('record')" id="nav-record">
    <span class="nav-icon">📥</span><span class="nav-label">記録</span>
  </button>
  <button class="nav-btn" onclick="showTab('calendar')" id="nav-calendar">
    <span class="nav-icon">🗓</span><span class="nav-label">カレンダー</span>
  </button>
  <button class="nav-btn" onclick="showTab('graph')" id="nav-graph">
    <span class="nav-icon">📊</span><span class="nav-label">グラフ</span>
  </button>
  <button class="nav-btn" onclick="showTab('summary')" id="nav-summary">
    <span class="nav-icon">📋</span><span class="nav-label">サマリー</span>
  </button>
</nav>

<!-- MAIN CONTENT -->
<main>

<!-- ===== 記録タブ ===== -->
<div id="tab-record" class="tab-content active">
  <div class="section-header">
    <h2>TODAY'S LOG</h2>
    <input type="date" id="date" class="date-input">
  </div>

  <!-- 目標バー -->
  <div class="goal-bar-card" id="goalBarCard" style="display:none;">
    <div class="goal-row">
      <span>🎯 目標カロリー差</span>
      <span id="goalBalanceText">-</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="goalProgress"></div></div>
  </div>

  <!-- 体重・カロリー -->
  <div class="card">
    <div class="card-title">BODY & FOOD</div>
    <div class="input-grid">
      <div class="input-group">
        <label>体重 <span class="unit">kg</span></label>
        <input type="number" id="weight" step="0.1" placeholder="70.0">
      </div>
      <div class="input-group">
        <label>摂取カロリー <span class="unit">kcal</span></label>
        <input type="number" id="intake" placeholder="2000">
      </div>
    </div>

    <!-- 食事写真AIカロリー計算 -->
    <div class="photo-section">
      <div class="photo-label">📸 食事写真からカロリーをAI推定</div>
      <label class="photo-upload-btn">
        🖼️ フォトライブラリから選択
        <input type="file" id="foodPhoto" accept="image/*" style="display:none">
      </label>
      <div id="photoPreview" style="display:none;">
        <img id="previewImg" style="width:100%;border-radius:10px;margin-top:8px;">
        <button class="ai-analyze-btn" onclick="analyzeFood()">🤖 AIでカロリー計算</button>
      </div>
      <div id="aiResult" class="ai-result" style="display:none;">
        <div id="aiResultText"></div>
        <div class="ai-edit-row">
          <label class="ai-edit-label">✏️ カロリーを修正</label>
          <div class="ai-edit-input-row">
            <input type="number" id="aiCalorieEdit" placeholder="kcal">
            <button class="ai-apply-btn" onclick="applyAiCalorie()">✅ 適用</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- トレーニング -->
  <div class="card">
    <div class="card-title-row">
      <div class="card-title">TRAINING</div>
      <button class="add-btn" id="addTraining">＋ 追加</button>
    </div>
    <div id="trainingContainer"></div>
  </div>

  <button class="save-btn" id="saveBtn">💾 記録を保存</button>

  <!-- サマリー -->
  <div class="card summary-card" id="summaryCard" style="display:none;">
    <div class="card-title">TODAY'S SUMMARY</div>
    <div id="summaryText"></div>
  </div>
</div>

<!-- ===== カレンダータブ ===== -->
<div id="tab-calendar" class="tab-content">
  <div class="section-header">
    <h2>CALENDAR</h2>
    <div class="month-nav">
      <button class="month-btn" onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel">2025年1月</span>
      <button class="month-btn" onclick="changeMonth(1)">›</button>
    </div>
  </div>
  <div class="weekday-row">
    <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
  </div>
  <div id="calendarContainer" class="calendar"></div>
</div>

<!-- ===== グラフタブ ===== -->
<div id="tab-graph" class="tab-content">
  <div class="section-header"><h2>GRAPHS</h2></div>
  <div class="graph-range">
    <button class="range-btn active" onclick="setRange(7, this)">7日</button>
    <button class="range-btn" onclick="setRange(30, this)">30日</button>
    <button class="range-btn" onclick="setRange(90, this)">90日</button>
  </div>
  <div class="card"><canvas id="calorieChart"></canvas></div>
  <div class="card"><canvas id="weightChart"></canvas></div>
  <div class="card"><canvas id="balanceChart"></canvas></div>
</div>

<!-- ===== サマリータブ ===== -->
<div id="tab-summary" class="tab-content">
  <div class="section-header"><h2>SUMMARY</h2></div>
  <div class="summary-toggle">
    <button class="toggle-btn active" onclick="setSummaryRange('week', this)">今週</button>
    <button class="toggle-btn" onclick="setSummaryRange('month', this)">今月</button>
  </div>
  <div id="summaryStats"></div>
</div>

</main>

<!-- ===== プロフィールモーダル ===== -->
<div id="profileModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">👤 プロフィール設定</div>
    <div class="profile-photo-section">
      <div class="profile-photo-preview" id="profilePhotoPreview" onclick="document.getElementById('profilePhotoInput').click()">
        <span id="profilePhotoIcon">👤</span>
        <img id="profilePhotoImg" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:50%;">
      </div>
      <div style="font-size:11px;color:#8899aa;margin-top:8px;text-align:center;">タップして写真を設定</div>
      <input type="file" id="profilePhotoInput" accept="image/*" style="display:none">
    </div>
    <div class="input-group"><label>名前</label><input type="text" id="profileName" placeholder="田中 雄介"></div>
    <div class="input-group"><label>年齢</label><input type="number" id="profileAge" placeholder="30"></div>
    <div class="input-group">
      <label>性別</label>
      <select id="profileGender">
        <option value="male">男性</option>
        <option value="female">女性</option>
      </select>
    </div>
    <div class="input-group"><label>身長 (cm)</label><input type="number" id="profileHeight" placeholder="170"></div>
    <div class="input-group">
      <label>日常生活の活動レベル <span class="unit">※運動は別入力</span></label>
      <select id="profileActivity">
        <option value="1.2">ほぼ座り仕事（運動なし）</option>
        <option value="1.25">週1〜2日の軽い運動</option>
        <option value="1.3">週3〜4日の適度な運動</option>
        <option value="1.375">週5〜6日の強度な運動</option>
        <option value="1.55">アスリート</option>
      </select>
      <div style="font-size:11px;color:#8899aa;margin-top:4px;">※運動消費カロリーはトレーニング入力で別途加算。二重計上を防ぐため日常生活分のみ設定してください。</div>
    </div>
    <hr style="border-color:#333;margin:15px 0;">
    <div class="modal-title">🎯 目標設定</div>
    <div class="input-group"><label>目標体重 (kg)</label><input type="number" id="goalWeight" step="0.1" placeholder="65.0"></div>
    <div class="input-group"><label>1日の目標カロリー差 (kcal)</label><input type="number" id="goalBalance" placeholder="-500（マイナスで減量）"></div>
    <div class="input-group">
      <div class="modal-title" style="margin-bottom:8px;">🏋️ カスタムトレーニング種目</div>
      <div id="customActivitiesContainer"></div>
      <button class="add-btn" onclick="addCustomActivity()" style="margin-top:8px;">＋ 種目追加</button>
    </div>
    <div class="modal-actions">
      <button class="save-btn" onclick="saveProfile()">保存</button>
      <button class="cancel-btn" onclick="closeModal('profileModal')">キャンセル</button>
    </div>
  </div>
</div>

<!-- ===== 日詳細モーダル ===== -->
<div id="detailModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div id="detailContent"></div>
    <button class="cancel-btn" onclick="closeModal('detailModal')" style="margin-top:15px;">閉じる</button>
  </div>
</div>

<!-- ===== AIローディング ===== -->
<div id="aiLoading" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="text-align:center;">
    <div class="ai-spinner">🤖</div>
    <div style="margin-top:10px;color:#fff;">AIが食事を分析中...</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
